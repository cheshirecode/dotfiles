name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-matrix:
    name: Dockerfile.test-matrix (ubuntu:24.04)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build + run install stages (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test-matrix
          tags: dotfiles-test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Auth-gated tools (Claude OAuth, Codex OAuth, gh PAT) deliberately
      # not exercised here. They require interactive auth that lives outside
      # CI. Document the omission rather than hide it:
      - name: Note on auth-gated tools
        run: |
          echo "Skipped (require interactive auth, not run in CI):"
          echo "  - Claude Code CLI install + login"
          echo "  - Codex CLI install + login"
          echo "  - gh-with-PAT push flows"
          echo "These are verified manually after a fresh install — see README.md."

  static:
    # Calls the runner rather than re-implementing its checks. The two steps
    # this replaced were a hand-copied subset — shellcheck on bin/*.sh plus a
    # manifest parse — and they had already drifted: `static` mode carries 13
    # checks, so 11 of them ran nowhere in CI. A copy of a lane is a lane that
    # silently stops matching.
    name: static — tests/run.sh static (13 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck + yaml
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pip install --quiet pyyaml
      - run: bash tests/run.sh static

  worklog-skill:
    name: worklog skill — shellcheck + ruff + fixture-vault smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck + ruff + yaml
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq
          pip install --quiet 'ruff==0.15.12' pyyaml
      - name: set git identity for fixture vault commits
        run: |
          git config --global user.email "ci@cheshirecode.test"
          git config --global user.name "ci-fixture"
          git config --global init.defaultBranch main
      - name: run worklog-skill test mode
        run: |
          ruff --version
          bash tests/run.sh worklog-skill

  fixtures:
    # The red-path guardrail suite — 105 checks that ran in no job at all, so
    # a regression in them surfaced only when someone invoked the mode by
    # hand. Measured green at 9e9a4d0 both normally and with rg, shellcheck
    # and ruff absent from PATH, which is what a bare runner looks like: the
    # lanes needing a missing tool skip rather than fail.
    name: fixtures — tests/run.sh fixtures (105 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install shellcheck + ruff + yaml
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq
          pip install --quiet 'ruff==0.15.12' pyyaml
      - name: git identity for fixture vault commits
        run: |
          git config --global user.email "ci@cheshirecode.test"
          git config --global user.name "ci-fixture"
          git config --global init.defaultBranch main
      - run: bash tests/run.sh fixtures

  packages:
    name: packages — loop-run sync+unittest, worklog-memory-mcp e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/worklog-memory-mcp/package-lock.json
      - name: deps
        run: cd packages/worklog-memory-mcp && npm install
      - name: git identity for e2e fixture vault
        run: |
          git config --global user.email "ci@cheshirecode.test"
          git config --global user.name "ci-fixture"
          git config --global init.defaultBranch main
      - run: bash tests/run.sh packages
