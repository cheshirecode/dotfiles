# Agent-skill manifest — declarative spec consumed by bin/install-skills.sh.
#
# Each entry pins a git SHA. SHA pinning IS the integrity check (content-
# addressed). Bump SHAs explicitly when upgrading; don't track moving branches.
#
# Targets:
#   every manifest skill is installed under ~/.claude/skills/<name>/,
#   ~/.agents/skills/<name>/, and ~/.cursor/skills/<name>/.
#   Entries marked optional: true are skipped by default; install one by name
#   or pass --include-optional.
#
# Skills that ship with Claude Code itself (init, review, security-review,
# claude-api, loop, schedule, statusline-setup, update-config, etc.) are
# NOT listed here — they're already on a fresh install.

version: 1

# High-value user-installed skills (cross-cutting, not project-specific).
skills:
  - name: council
    description: Run independent, multi-angle research and voting for /council, requested multiple opinions or audited research, or an authorized loop escalation.
    source:
      type: subpath  # checkout a single subdir of the source repo
      ref: HEAD  # tracking; pin to SHA once upstreamed
      path: skills/council
    install_to: ~/.claude/skills/council
    # Council ships in this dotfiles repo (skills/council/SKILL.md) until it
    # graduates to a standalone repo. install-skills.sh treats subpath as
    # "copy this directory" rather than "clone whole repo".

  # Personal, not cross-cutting, so it ships here without installing by
  # default — but it is declared, so check-manifest's coverage rule passes and
  # the next skill added to skills/ cannot go missing silently.
  - name: job-application
    description: Tailor a resume, cover letter and skills keywords to one supplied job description. Use for application packages; exclude general resume review and interview prep.
    optional: true
    source:
      type: subpath
      ref: HEAD
      path: skills/job-application
    install_to: ~/.claude/skills/job-application

  # Sourcing half of the job-hunting pair: job-search finds and pools postings,
  # job-application tailors one of them. Optional for the same reason as its
  # sibling — personal tooling, not part of a working checkout.
  - name: job-search
    description: Source remote job postings from public boards into a _worklog program. Use to build a candidate pool; application tailoring belongs to job-application.
    optional: true
    source:
      type: subpath
      ref: HEAD
      path: skills/job-search
    install_to: ~/.claude/skills/job-search

  # Machine-setup tooling: installs the uv-managed browser-use CLI and its
  # vendor skill. Optional — named browser-use-setup deliberately, because the
  # vendor `browser-use skill install` owns the browser-use directory name in
  # every harness root and must not collide with install.sh's symlinks.
  - name: browser-use-setup
    description: Install, wrap, and connect the browser-use CLI across macOS and Linux.
    optional: true
    source:
      type: subpath
      ref: HEAD
      path: skills/browser-use-setup
    install_to: ~/.claude/skills/browser-use-setup

  # The no-browser half of web reading: local engines (lightpanda, crw,
  # crawl4ai) that turn many pages into markdown. browser-use keeps clicks,
  # logins and bot walls. Optional: the engines are a separate install.
  - name: fast-crawl
    description: Read or crawl web pages as Markdown with local engines. Use for bulk or JS-rendered page reads; clicks, logins and bot walls belong to browser-use.
    optional: true
    source:
      type: subpath
      ref: HEAD
      path: skills/fast-crawl
    install_to: ~/.claude/skills/fast-crawl

  - name: webmcp-integration
    description: Apply page-scoped WebMCP tools to an existing repo, with impresspress-inspired sandbox guidance.
    optional: true
    source:
      type: subpath
      ref: HEAD
      path: skills/webmcp-integration
    install_to: ~/.claude/skills/webmcp-integration

  - name: worklog
    description: Manage the shared _worklog journal across machines. Use /worklog MODE [args] for planning, status, context, sync and handoffs; bare /worklog or unknown args show help.
    source:
      type: subpath
      ref: HEAD
      path: skills/worklog
    install_to: ~/.claude/skills/worklog
    # The worklog SKILL ships separately from the _worklog repo. This entry
    # installs the skill files; bin/install-worklog.sh clones the repo +
    # wires hooks.

  - name: loop-engineering
    description: Bounded, evidence-driven loops with worklog-backed context and handoffs.
    source:
      type: subpath
      ref: HEAD
      path: skills/loop-engineering
    install_to: ~/.claude/skills/loop-engineering

  - name: slack-feedback
    description: Follow a Slack thread as ongoing engineering feedback when explicitly asked to watch or work from it. Ordinary thread reads do not activate a watch.
    optional: true
    source:
      type: subpath
      ref: HEAD
      path: skills/slack-feedback
    install_to: ~/.claude/skills/slack-feedback

  - name: pr-cost
    description: Collect AI cost data for a PR into a local ledger when cost tracking is requested or a configured adapter invokes it. Posting requires live-write authorization.
    source:
      type: subpath
      ref: HEAD
      path: skills/pr-cost
    install_to: ~/.claude/skills/pr-cost

  - name: brainstorm
    description: Idea generation from observed pains; routes evaluation to council, records via worklog.
    source:
      type: subpath
      ref: HEAD
      path: skills/brainstorm
    install_to: ~/.claude/skills/brainstorm

  - name: loop-helpers
    description: Opt-in transport gates and compact context-pack helpers for loop-engineering.
    optional: true
    source:
      type: subpath
      ref: HEAD
      path: skills/loop-helpers
    install_to: ~/.claude/skills/loop-helpers

  - name: evidence-gate
    description: Verify multi-clause completion claims against command, artifact, Git, GitHub or URL evidence. Use when passing tests alone cannot prove delivery or user-visible success.
    source:
      type: subpath
      ref: HEAD
      path: skills/evidence-gate
    install_to: ~/.claude/skills/evidence-gate

  - name: requirement-sync
    description: Reconcile changed requirements or facts across records and derived views. Use when written sources disagree after a change; ordinary task-status updates belong to worklog.
    source:
      type: subpath
      ref: HEAD
      path: skills/requirement-sync
    install_to: ~/.claude/skills/requirement-sync

  - name: pr-review
    description: Review one PR or close out completed work, including tighten-up and wrap-up requests. Multi-PR sweeps belong to ship-hygiene.
    source:
      type: subpath
      ref: HEAD
      path: skills/pr-review
    install_to: ~/.claude/skills/pr-review

  - name: ship-hygiene
    description: Sweep multiple open PRs for stale tasks, failing CI, unresolved reviews and cleanup. Use for PR hygiene or /ship-hygiene; one PR belongs to pr-review.
    source:
      type: subpath
      ref: HEAD
      path: skills/ship-hygiene
    install_to: ~/.claude/skills/ship-hygiene

  - name: serena-rg-search
    description: Choose tools for multi-faceted code investigation across symbols, text, history and logs. Skip simple literal searches and known-file lookups.
    source:
      type: subpath
      ref: HEAD
      path: skills/serena-rg-search
    install_to: ~/.claude/skills/serena-rg-search
    # NOTE: serena-rg-search also needs the Serena MCP server registered.
    # See docs/mcp-servers.md for the .mcp.json snippet.

  - name: karpathy-guidelines
    description: Behavioral guidelines reducing common LLM coding mistakes.
    source:
      type: subpath
      ref: HEAD
      path: skills/karpathy-guidelines
    install_to: ~/.claude/skills/karpathy-guidelines

  - name: example-led-instructions
    description: Design compact examples for brittle reusable instructions, schemas or output formats when behavior is underspecified or repeatedly wrong, or when explicitly invoked.
    source:
      type: subpath
      ref: HEAD
      path: skills/example-led-instructions
    install_to: ~/.claude/skills/example-led-instructions

  - name: tightening-a-pr
    description: DEPRECATED shim — delegates to pr-review's closeout entry point. Kept so existing routing keeps working.
    source:
      type: subpath
      ref: HEAD
      path: skills/tightening-a-pr
    install_to: ~/.claude/skills/tightening-a-pr

  - name: which-model
    description: Choose model lanes by capability, cost and harness availability. Use /which-model for model recommendations, token-value comparisons or session model selection.
    source:
      type: subpath
      ref: HEAD
      path: skills/which-model
    install_to: ~/.claude/skills/which-model

  - name: artifact-gate
    description: Check shared HTML before publication for structural errors, broken links and factual drift. Use to verify links and claims; visual design critique belongs to impeccable.
    source:
      type: subpath
      ref: HEAD
      path: skills/artifact-gate
    install_to: ~/.claude/skills/artifact-gate

# Notes:
# - `source.ref: HEAD` is a placeholder for skills that live inside THIS repo
#   (vendored under skills/<name>/). When a skill graduates to its own repo,
#   change `repo:` to that URL and pin a real SHA.
# - For ref: <sha> form, bin/install-skills.sh does `git checkout <sha>` after
#   clone and refuses to proceed on a dirty SHA mismatch.
# - To upgrade a skill: bump the ref:, re-run `bin/install-skills.sh`.
